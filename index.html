  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Initial Menu Data
    const DEFAULT_MENU = [
      {
        id: 'fried-chicken',
        name: 'Fried Chicken',
        category: 'Chicken Specialties',
        price: 100,
        image: 'assets/images/fried_chicken.jpg',

        id: 'mint-chicken',

        description: 'Spicy South-Indian style black pepper fried chicken sprinkled with crispy curry leaves.',
        rating: '4.9 ★ (290+ reviews)',
        isPopular: true
      },
      {
        id: 'boneless-65',
        name: 'Boneless 65',
        category: 'Chicken Specialties',
        price: 100,
        image: 'assets/images/boneless_65.jpg',
        description: 'Bite-sized boneless chicken pieces fried to red crispy perfection with green chilies.',
        rating: '5.0 ★ (410+ reviews)',
        isPopular: true
      },
      {
        id: 'fried-rice-noodles',
        name: 'Fried Rice / Noodles',
        category: 'Mains & Combos',
        price: 110,
        image: 'https://images.unsplash.com/photo-1512058564366-18510be2db19?q=80&w=800&auto=format&fit=crop',
        description: 'Hot wok-tossed savory fried rice or egg noodles loaded with fresh veggies & chicken.',
        rating: '4.7 ★ (195+ reviews)',
        isPopular: false

        id: 'veg-mayonnaise',
        name: 'Veg Mayonnaise',
        category: 'Dips & Extra',
        price: 20,
        image: 'https://images.unsplash.com/photo-1571091718767-18b5b1457add?q=80&w=800&auto=format&fit=crop',
        description: 'Rich, thick & creamy eggless garlic mayonnaise dip - perfect companion for hot fried chicken.',

        isEditable: true,
        isPopular: false
      }

    function App() {
      // Menu Items state (with editable price support)
      const [menuItems, setMenuItems] = useState(() => {
        const savedMenu = localStorage.getItem('skfc_menu_items');
        return savedMenu ? JSON.parse(savedMenu) : DEFAULT_MENU;
      });

      // Cart State
      const [cart, setCart] = useState(() => {
        const savedCart = localStorage.getItem('skfc_cart');
        return savedCart ? JSON.parse(savedCart) : [];
      });

      // Quantity selector per item on Menu Card
      const [quantities, setQuantities] = useState({});

      // UI Controls
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
      const [isPriceAdminOpen, setIsPriceAdminOpen] = useState(false);
      const [activeCategory, setActiveCategory] = useState('All');
      const [currentOrder, setCurrentOrder] = useState(null);

      // Save Cart to LocalStorage
      useEffect(() => {
        localStorage.setItem('skfc_cart', JSON.stringify(cart));
      }, [cart]);

      // Save Menu to LocalStorage when updated
      useEffect(() => {
        localStorage.setItem('skfc_menu_items', JSON.stringify(menuItems));
      }, [menuItems]);

      // Re-initialize Lucide Icons after DOM updates
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Quantity Handlers for menu cards
      const handleQuantityChange = (itemId, delta) => {
        setQuantities(prev => {
          const current = prev[itemId] || 1;
          const updated = Math.max(1, current + delta);
          return { ...prev, [itemId]: updated };
        });
      };

      // Add Item to Cart
      const addToCart = (item) => {
        const qtyToAdd = quantities[item.id] || 1;
        setCart(prevCart => {
          const existingIndex = prevCart.findIndex(cartItem => cartItem.id === item.id);
          if (existingIndex > -1) {
            const updated = [...prevCart];
            updated[existingIndex].quantity += qtyToAdd;
            return updated;
          } else {
            return [...prevCart, { ...item, quantity: qtyToAdd }];
          }
        });

        // Reset local qty selector for this card
        setQuantities(prev => ({ ...prev, [item.id]: 1 }));
        
        // Show notification toast or open drawer
        setIsCartOpen(true);
      };

      // Cart Quantity Adjustments
      const updateCartQuantity = (itemId, newQty) => {
        if (newQty <= 0) {
          removeFromCart(itemId);
          return;
        }
        setCart(prev => prev.map(item => item.id === itemId ? { ...item, quantity: newQty } : item));
      };

      const removeFromCart = (itemId) => {
        setCart(prev => prev.filter(item => item.id !== itemId));
      };

      const clearCart = () => {
        setCart([]);
      };

      // Calculate Totals
      const cartCount = useMemo(() => cart.reduce((total, item) => total + item.quantity, 0), [cart]);
      const subtotal = useMemo(() => cart.reduce((total, item) => total + (item.price * item.quantity), 0), [cart]);
      const deliveryFee = subtotal > 0 ? (subtotal >= 400 ? 0 : 30) : 0;
      const grandTotal = subtotal + deliveryFee;

      // Handle Price Update from Admin Modal
      const handlePriceUpdate = (itemId, newPrice) => {
        setMenuItems(prev => prev.map(item => item.id === itemId ? { ...item, price: Number(newPrice) } : item));
        
        // Also update items in current cart if present
        setCart(prevCart => prevCart.map(cartItem => cartItem.id === itemId ? { ...cartItem, price: Number(newPrice) } : cartItem));
      };

      // Submit Order
      const handlePlaceOrder = (orderDetails) => {
        const orderId = 'SKFC-' + Math.floor(100000 + Math.random() * 900000);
        const orderData = {
          orderId,
          date: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }),
          items: [...cart],
          subtotal,
          deliveryFee,
          grandTotal,
          customer: orderDetails.customer,
          paymentMethod: orderDetails.paymentMethod,
          paymentStatus: orderDetails.paymentMethod === 'cod' ? 'Pending (COD)' : 'Paid Online',
          status: 'Preparing'
        };

        setCurrentOrder(orderData);
        clearCart();
        setIsCheckoutOpen(false);
        setIsCartOpen(false);
      };

      // Categories
      const categories = ['All', 'Chicken Specialties', 'Flavored Specials', 'Mains & Combos', 'Dips & Extra'];
      const filteredMenu = activeCategory === 'All' 
        ? menuItems 
        : menuItems.filter(item => item.category === activeCategory);

      return (
        <div className="min-h-screen flex flex-col bg-white">

              {/* Brand Logo & Name */}

                  <span className="text-2xl">🍗</span>
                </div>
                <div>
                  <h1 className="font-brand font-black text-lg sm:text-xl md:text-2xl tracking-tight text-gray-900 uppercase leading-none">
                    SHAALU KUNJI <span className="text-red-600">FRIED CHICKEN</span>
                  </h1>
                  <p className="text-xs font-semibold text-amber-600 flex items-center gap-1 mt-0.5">
                    <i data-lucide="map-pin" className="w-3 h-3 text-red-500"></i> Maadha Kottai, Thanjavur
                  </p>
                </div>
              </a>

              {/* Desktop Nav Links */}
              <nav className="hidden md:flex items-center gap-8 font-medium text-gray-700">
                <a href="#home" className="hover:text-red-600 transition-colors">Home</a>
                <a href="#menu" className="hover:text-red-600 transition-colors flex items-center gap-1">
                  Menu <span className="px-2 py-0.5 text-[10px] bg-red-100 text-red-600 font-bold rounded-full">Hot</span>
                </a>
                <a href="#contact" className="hover:text-red-600 transition-colors">Contact</a>
                <button 
                  onClick={() => setIsPriceAdminOpen(true)}
                  className="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg flex items-center gap-1.5 font-semibold transition-colors"
                  title="Admin Price Manager"
                >
                  <i data-lucide="settings" className="w-3.5 h-3.5 text-gray-600"></i> Admin Price Edit
                </button>
              </nav>

              {/* Actions Right */}
              <div className="flex items-center gap-3 sm:gap-4">
                {/* Call Button */}
                <a

                  className="hidden sm:flex items-center gap-2 bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200/80 px-3.5 py-2 rounded-xl text-sm font-bold transition-all hover:scale-105"
                >
                  <i data-lucide="phone-call" className="w-4 h-4 text-amber-600"></i>
                  <span>7708807097</span>
                </a>

                  <span className="hidden sm:inline">Cart</span>

                      {cartCount}
                    </span>

            </div>

                    </div>

                    {/* Main Shop Name - ULTRA BOLD */}
                    <h1 className="font-brand font-black text-4xl sm:text-5xl md:text-6xl lg:text-7xl text-gray-900 tracking-tight leading-[1.08] mb-6 uppercase">

                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Pincode</label>
                    <input 
                      type="text"
                      name="pincode"
                      value={formData.pincode}
                      onChange={handleChange}
                      className="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-600 focus:outline-none text-sm"
                    />
                  </div>
                </div>

                <div className="mt-4">
                  <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Special Delivery Instructions (Optional)</label>
                  <input 
                    type="text"
                    name="notes"
                    value={formData.notes}
                    onChange={handleChange}
                    placeholder="e.g. Extra spicy, call upon arrival"
                    className="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-600 focus:outline-none text-sm"
                  />
                </div>
              </div>

              {/* Section 3: Select Payment Method */}
              <div>
                <h4 className="font-brand font-bold text-lg text-gray-900 mb-4 flex items-center gap-2">
                  <i data-lucide="credit-card" className="w-5 h-5 text-red-600"></i>
                  <span>3. Select Payment Method</span>
                </h4>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                  {/* COD */}
                  <label className={`p-4 rounded-2xl border-2 cursor-pointer flex flex-col items-center text-center transition-all ${
                    paymentMethod === 'cod' ? 'border-red-600 bg-red-50/50 text-red-900' : 'border-gray-200 hover:border-gray-300'
                  }`}>
                    <input 
                      type="radio" 
                      name="payment" 
                      value="cod" 
                      checked={paymentMethod === 'cod'} 
                      onChange={() => setPaymentMethod('cod')} 
                      className="sr-only"
                    />
                    <span className="text-2xl mb-1">💵</span>
                    <span className="font-extrabold text-sm">Cash on Delivery</span>
                    <span className="text-[10px] text-gray-500 mt-1">Pay when food arrives</span>
                  </label>

                  {/* UPI */}
                  <label className={`p-4 rounded-2xl border-2 cursor-pointer flex flex-col items-center text-center transition-all ${
                    paymentMethod === 'upi' ? 'border-red-600 bg-red-50/50 text-red-900' : 'border-gray-200 hover:border-gray-300'
                  }`}>
                    <input 
                      type="radio" 
                      name="payment" 
                      value="upi" 
                      checked={paymentMethod === 'upi'} 
                      onChange={() => setPaymentMethod('upi')} 
                      className="sr-only"
                    />
                    <span className="text-2xl mb-1">📱</span>
                    <span className="font-extrabold text-sm">UPI Payment</span>
                    <span className="text-[10px] text-gray-500 mt-1">GPay / PhonePe / Paytm</span>
                  </label>

                  {/* Card */}
                  <label className={`p-4 rounded-2xl border-2 cursor-pointer flex flex-col items-center text-center transition-all ${
                    paymentMethod === 'card' ? 'border-red-600 bg-red-50/50 text-red-900' : 'border-gray-200 hover:border-gray-300'
                  }`}>
                    <input 
                      type="radio" 
                      name="payment" 
                      value="card" 
                      checked={paymentMethod === 'card'} 
                      onChange={() => setPaymentMethod('card')} 
                      className="sr-only"
                    />
                    <span className="text-2xl mb-1">💳</span>
                    <span className="font-extrabold text-sm">Credit / Debit Card</span>
                    <span className="text-[10px] text-gray-500 mt-1">Visa, Mastercard, RuPay</span>
                  </label>
                </div>

                {/* UPI QR & Details Sub-box */}
                {paymentMethod === 'upi' && (
                  <div className="bg-amber-50 p-4 rounded-2xl border border-amber-200 text-center space-y-3">
                    <p className="text-xs font-bold text-amber-900">Scan QR Code or pay to UPI ID: <span className="font-mono text-sm text-red-600">7708807097@upi</span></p>
                    <div className="w-32 h-32 bg-white p-2 mx-auto rounded-xl shadow-md border border-amber-300 flex items-center justify-center">
                      {/* Simulated QR Code SVG */}
                      <svg viewBox="0 0 100 100" className="w-full h-full">
                        <rect x="0" y="0" width="100" height="100" fill="#ffffff" />
                        <rect x="10" y="10" width="30" height="30" fill="#000000" />
                        <rect x="15" y="15" width="20" height="20" fill="#ffffff" />
                        <rect x="20" y="20" width="10" height="10" fill="#000000" />
                        <rect x="60" y="10" width="30" height="30" fill="#000000" />
                        <rect x="65" y="15" width="20" height="20" fill="#ffffff" />
                        <rect x="70" y="20" width="10" height="10" fill="#000000" />
                        <rect x="10" y="60" width="30" height="30" fill="#000000" />
                        <rect x="15" y="65" width="20" height="20" fill="#ffffff" />
                        <rect x="20" y="70" width="10" height="10" fill="#000000" />
                        <rect x="45" y="45" width="15" height="15" fill="#dc2626" />
                        <rect x="60" y="60" width="25" height="25" fill="#000000" />
                      </svg>
                    </div>
                    <p className="text-[11px] text-gray-600">Razorpay / UPI Payment Gateway Simulation Mode Enabled</p>
                  </div>
                )}

                {/* Card Payment Inputs */}
                {paymentMethod === 'card' && (
                  <div className="bg-gray-50 p-4 rounded-2xl border border-gray-200 space-y-3">
                    <input 
                      type="text"
                      placeholder="Card Number (4532 •••• •••• 8890)"
                      className="w-full px-4 py-2 rounded-xl border border-gray-300 text-sm"
                      value={cardData.number}
                      onChange={e => setCardData({...cardData, number: e.target.value})}
                    />
                    <div className="grid grid-cols-2 gap-3">
                      <input 
                        type="text"
                        placeholder="MM/YY"
                        className="w-full px-4 py-2 rounded-xl border border-gray-300 text-sm"
                        value={cardData.expiry}
                        onChange={e => setCardData({...cardData, expiry: e.target.value})}
                      />
                      <input 
                        type="password"
                        placeholder="CVV"
                        className="w-full px-4 py-2 rounded-xl border border-gray-300 text-sm"
                        value={cardData.cvv}
                        onChange={e => setCardData({...cardData, cvv: e.target.value})}
                      />
                    </div>
                  </div>
                )}
              </div>

              {/* Grand Total Bar */}
              <div className="bg-red-50 p-4 rounded-2xl border border-red-100 flex items-center justify-between">
                <div>
                  <p className="text-xs font-bold text-red-700 uppercase">Total Payable Amount</p>
                  <p className="font-brand font-black text-2xl text-red-600">₹{grandTotal}</p>
                </div>
                <button
                  type="submit"
                  disabled={isProcessing}
                  className="bg-red-600 hover:bg-red-700 text-white font-black text-lg px-8 py-3.5 rounded-2xl shadow-xl shadow-red-600/30 flex items-center gap-2 transition-all hover:scale-105 active:scale-95 disabled:opacity-50"
                >
                  {isProcessing ? 'Processing Order...' : 'CONFIRM & PLACE ORDER'}
                </button>
              </div>

            </form>

          </div>
        </div>
      );
    }

    // PRICE ADMIN CONFIGURATION MODAL (Edit Veg Mayonnaise & Items)
    function PriceAdminModal({ menuItems, onClose, onUpdatePrice }) {
      const [editingPrices, setEditingPrices] = useState({});

      const handleSave = (itemId) => {
        const newPrice = editingPrices[itemId];
        if (newPrice !== undefined && newPrice !== '') {
          onUpdatePrice(itemId, newPrice);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-gray-900/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden">
            
            <div className="bg-gray-900 text-white p-6 flex items-center justify-between">
              <div>
                <h3 className="font-brand font-black text-xl uppercase text-amber-400">⚙️ ADMIN MENU PRICE MANAGER</h3>
                <p className="text-xs text-gray-300">Easily update prices for Veg Mayonnaise & items in real-time</p>
              </div>
              <button 
                onClick={onClose}
                className="w-8 h-8 rounded-full bg-gray-800 text-gray-300 flex items-center justify-center"
              >
                ✕
              </button>
            </div>

            <div className="p-6 max-h-96 overflow-y-auto space-y-4">
              {menuItems.map(item => (
                <div key={item.id} className="flex items-center justify-between p-3 bg-gray-50 rounded-2xl border border-gray-200">
                  <div className="flex items-center gap-3">
                    <img src={item.image} alt={item.name} className="w-12 h-12 rounded-xl object-cover" />
                    <div>
                      <h5 className="font-bold text-gray-900 text-sm">{item.name}</h5>
                      <span className="text-xs text-gray-500 font-semibold">Current: ₹{item.price}</span>
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <span className="font-bold text-gray-700">₹</span>
                    <input 
                      type="number"
                      placeholder={item.price}
                      defaultValue={item.price}
                      onChange={e => setEditingPrices({...editingPrices, [item.id]: e.target.value})}
                      className="w-20 px-3 py-1.5 rounded-lg border border-gray-300 text-sm font-bold focus:ring-2 focus:ring-red-600 focus:outline-none"
                    />
                    <button
                      onClick={() => handleSave(item.id)}
                      className="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition-colors"
                    >
                      Save
                    </button>
                  </div>
                </div>
              ))}
            </div>

            <div className="p-4 bg-gray-50 border-t border-gray-100 text-center">
              <button
                onClick={onClose}
                className="bg-gray-900 text-white font-bold px-6 py-2 rounded-xl text-sm"
              >
                Close Manager
              </button>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
